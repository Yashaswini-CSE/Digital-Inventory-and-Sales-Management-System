<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Notifications</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2>Inventory System</h2>
        <a href="index.html">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="customers.html">Customers</a>
        <a href="sales.html">Sales</a>
        <a href="notifications.html">Notifications</a>
        <a href="reports.html">Reports</a>
    </div>

    <div class="main">
        <h1>Stock Notifications</h1>
        <p>Monitor products that are running low.</p>

        <div class="cards">

            <div class="card">
                <h3>Total Low Stock Items</h3>
                <h2 id="lowCount">2</h2>
            </div>

            <div class="card">
                <h3>Available Items</h3>
                <h2 id="availableCount">1</h2>
            </div>

        </div>

        <h2 class="section-title">Low Stock Alerts</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Product Name</th>
<th>Notification Message</th>
<th>Date & Time</th>
<th>Status</th>
                    </tr>
                </thead>

                <tbody id="lowStockTable"></tbody>
            </table>
        </div>
    </div>
 <script src="script.js"></script>

<script>
async function displayNotifications() {
    const lowStockTable = document.getElementById("lowStockTable");

    try {
        // Fetch notifications and current products from MySQL
        const [notificationResponse, productResponse] =
            await Promise.all([
                fetch("/api/notifications"),
                fetch("/api/products")
            ]);

        if (!notificationResponse.ok || !productResponse.ok) {
            throw new Error("Failed to load data");
        }

        const notifications = await notificationResponse.json();
        const products = await productResponse.json();

        // Calculate current stock status
        const lowStockProducts = products.filter(product =>
            Number(product.quantity) <= Number(product.min_stock)
        );

        const availableProducts = products.filter(product =>
            Number(product.quantity) > 0
        );

        // Update summary cards
        document.getElementById("lowCount").textContent =
            lowStockProducts.length;

        document.getElementById("availableCount").textContent =
            availableProducts.length;

        // Display notification history
        lowStockTable.innerHTML = "";

        if (notifications.length === 0) {
            const row = lowStockTable.insertRow();
            const cell = row.insertCell();

            cell.colSpan = 4;
            cell.textContent = "No notifications available!";
            return;
        }

        notifications.forEach(notification => {
            const row = lowStockTable.insertRow();

            row.insertCell().textContent = notification.product_name;
            row.insertCell().textContent = notification.message;

            row.insertCell().textContent =
                new Date(notification.created_at).toLocaleString();

            const statusCell = row.insertCell();

            statusCell.textContent = notification.status;

            if (notification.status === "Pending") {
                const button = document.createElement("button");

                button.textContent = "Mark as Read";

                button.onclick = async function () {
                    try {
                        const response = await fetch(
                            `/api/notifications/${notification.id}`,
                            { method: "PUT" }
                        );

                        if (!response.ok) {
                            throw new Error("Failed to update status");
                        }

                        displayNotifications();

                    } catch (error) {
                        console.error(error);
                        alert("Could not update notification status.");
                    }
                };

                statusCell.appendChild(button);
            }
        });

    } catch (error) {
        console.error(error);
        alert("Could not load notifications from database.");
    }
}

displayNotifications();

</script>

</body>
</html>
