
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sidebar">
        <h2>Inventory System</h2>
        <a href="index.html">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="customers.html">Customers</a>
        <a href="sales.html">Sales</a>
        <a href="notifications.html">Notifications</a>
        <a href="reports.html">Reports</a>
    </div>

    <div class="main">
        <h1>Sales Management</h1>
        <p>Record and manage customer purchases.</p>

        <div class="product-form">
            <h2>Record New Sale</h2>

            <form id="salesForm">

                <label>Customer Name</label><br>
                <select id="customer" required>
                    <option value="">Loading Customers...</option>
                </select>

                <br><br>

                <label>Product Name</label><br>
                <select id="product" required>
                    <option value="">Loading Products...</option>
                </select>

                <br><br>

                <label>Quantity</label><br>
                <input type="number" id="quantity"
                    min="1" placeholder="Quantity" required>

                <br><br>

                <label>Price per Item (₹)</label><br>
                <input type="number" id="price"
                    min="0.01" step="0.01"
                    placeholder="Automatic Price" readonly required>

                <br><br>

                <label>Total Amount</label><br>
                <input type="text" id="total"
                    placeholder="₹0.00" readonly>

                <br><br>

                <button type="submit">Record Sale</button>

            </form>
        </div>

        <h2 class="section-title">Sales History</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Sale ID</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Total Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="salesTable"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        const productDropdown = document.getElementById("product");
        const customerDropdown = document.getElementById("customer");
        const salesForm = document.getElementById("salesForm");
        const quantityInput = document.getElementById("quantity");
        const priceInput = document.getElementById("price");
        const totalInput = document.getElementById("total");
        const salesTable = document.getElementById("salesTable");

        // Store database records for this page
        let salesPageProducts = [];
        let salesPageCustomers = [];

        // LOAD PRODUCTS FROM MYSQL
        async function loadProductsForSales() {
            try {
                const response = await fetch("/api/products");

                if (!response.ok) {
                    throw new Error("Could not fetch products");
                }

                salesPageProducts = await response.json();

                productDropdown.innerHTML =
                    '<option value="">Select Product</option>';

                salesPageProducts.forEach(item => {
                    const option = document.createElement("option");

                    option.value = item.name;

                    option.textContent =
                        item.name + " (Stock: " + item.quantity + ")";

                    if (Number(item.quantity) <= 0) {
                        option.disabled = true;
                        option.textContent += " - Out of Stock";
                    }

                    productDropdown.appendChild(option);
                });

            } catch (error) {
                console.error("Product loading error:", error);

                productDropdown.innerHTML =
                    '<option value="">Failed to load products</option>';
            }
        }

        // LOAD CUSTOMERS FROM MYSQL
        async function loadCustomersForSales() {
            try {
                const response = await fetch("/api/customers");

                if (!response.ok) {
                    throw new Error("Could not fetch customers");
                }

                salesPageCustomers = await response.json();

                customerDropdown.innerHTML =
                    '<option value="">Select Customer</option>';

                salesPageCustomers.forEach(item => {
                    const option = document.createElement("option");

                    option.value = item.name;
                    option.textContent = item.name;

                    customerDropdown.appendChild(option);
                });

            } catch (error) {
                console.error("Customer loading error:", error);

                customerDropdown.innerHTML =
                    '<option value="">Failed to load customers</option>';
            }
        }

        // DISPLAY SALES HISTORY
        function displaySalesPageRecords(salesRecords) {
            salesTable.innerHTML = "";

            salesRecords.forEach(sale => {
                const row = salesTable.insertRow();

                const values = [
                    sale.saleId,
                    sale.customer,
                    sale.product,
                    sale.quantity,
                    "₹" + Number(sale.total).toFixed(2),
                    sale.date
                ];

                values.forEach(value => {
                    const cell = row.insertCell();
                    cell.textContent = value ?? "";
                });
            });
        }

        // LOAD SALES FROM MYSQL
        async function loadSalesFromDatabase() {
            try {
                const response = await fetch("/api/sales");

                if (!response.ok) {
                    throw new Error("Could not fetch sales");
                }

                const databaseSales = await response.json();

                displaySalesPageRecords(databaseSales);

            } catch (error) {
                console.error("Sales loading error:", error);
            }
        }

        // CALCULATE TOTAL
        function calculateSalesTotal() {
            const quantity = Number(quantityInput.value);
            const price = Number(priceInput.value);

            totalInput.value =
                quantity > 0 && price > 0
                    ? "₹" + (quantity * price).toFixed(2)
                    : "";
        }

        // AUTOMATICALLY FETCH PRICE FROM DATABASE PRODUCT
        productDropdown.addEventListener("change", function() {

            const selectedProduct = salesPageProducts.find(
                item => item.name === productDropdown.value
            );

            priceInput.value = selectedProduct
                ? Number(selectedProduct.price)
                : "";

            calculateSalesTotal();
        });

        quantityInput.addEventListener("input", calculateSalesTotal);

        // RECORD SALE
        salesForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const customer = customerDropdown.value;
            const product = productDropdown.value;
            const quantity = Number(quantityInput.value);

            const selectedProduct = salesPageProducts.find(
                item => item.name === product
            );

            if (!customer || !selectedProduct || quantity <= 0) {
                alert("Please enter valid sale details.");
                return;
            }

            if (quantity > Number(selectedProduct.quantity)) {
                alert("Insufficient stock available!");
                return;
            }

            try {
                const response = await fetch("/api/sales", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        customer: customer,
                        product: product,
                        quantity: quantity
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Could not record sale."
                    );
                }

                alert("Sale recorded successfully!");

                salesForm.reset();

                priceInput.value = "";
                totalInput.value = "";

                // Refresh products, stock and sales history
                await loadProductsForSales();
                await loadSalesFromDatabase();

            } catch (error) {
                console.error("Sale error:", error);
                alert(error.message || "Could not record sale.");
            }
        });

        // LOAD ALL DATA WHEN PAGE OPENS
        loadProductsForSales();
        loadCustomersForSales();
        loadSalesFromDatabase();

    </script>

</body>
</html>
