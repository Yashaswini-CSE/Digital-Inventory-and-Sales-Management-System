<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Inventory System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2>Inventory System</h2>
        <a href="index.html">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="customers.html">Customers</a>
        <a href="sales.html">Sales</a>
        <a href="notifications.html">Notifications</a>
        <a href="reports.html">Reports</a>
    </div>

    <div class="main">
        <h1>Products Management</h1>
        <p>Manage your inventory products here.</p>

        <div class="product-form">
            <h2>Add New Product</h2>

            <form id="productForm">
                <input type="text" id="productName"
                    placeholder="Product Name" required>

                <input type="number" id="price"
                    placeholder="Price (₹)" min="0.01"
                    step="0.01" required>

                <input type="number" id="quantity"
                    placeholder="Quantity" min="0" required>

                <input type="number" id="minStock"
                    placeholder="Minimum Stock" min="0" required>
                    <label for="productImage">Product Picture</label>
<input type="file" id="productImage" accept="image/*">

<div id="imagePreview" style="margin:10px 0;">
    <img id="previewImage"
         style="width:120px;height:120px;object-fit:cover;display:none;border-radius:10px;">
</div>

                <button type="submit">Add Product</button>
            </form>
            <div id="editForm" style="display:none; margin-top:20px;">
    <h2>Edit Product</h2>

    <label>Product Name</label>
    <input type="text" id="editName" readonly>

    <label>Price</label>
    <input type="number" id="editPrice">

    <label>Quantity</label>
    <input type="number" id="editQuantity">

    <label>Minimum Stock</label>
    <input type="number" id="editMinStock">

    <button type="button" onclick="updateProduct()">Update Product</button>
    <button type="button" onclick="cancelEdit()">Cancel</button>
</div>
        </div>

        <h2 class="section-title">Product List</h2>

       <h2 class="section-title">Our Products</h2>

<div class="product-grid" id="productGrid">
</div>
    </div>
 <script src="script.js"></script>
    <script>
       // Get HTML elements
const form = document.getElementById("productForm");
const productGrid = document.getElementById("productGrid");
const imageInput = document.getElementById("productImage");
const previewImage = document.getElementById("previewImage");

let selectedImage = "";
let editingProduct = null;


// Preview product picture
imageInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (event) {
        selectedImage = event.target.result;

        previewImage.src = selectedImage;
        previewImage.style.display = "block";
    };

    reader.readAsDataURL(file);
});


// Display all products
function displayProducts() {

    productGrid.innerHTML = "";

    products.forEach((product, index) => {

        const status =
            Number(product.quantity) <= Number(product.minStock)
                ? "Low Stock" : "Available";
const productImages = {
    "Notebook": "https://images.unsplash.com/photo-1531346878377-a5be20888e57?w=300",
    "Pen": "https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?w=300",
    "Eraser": "https://assets.grandandtoy.com/graphics/1500x1500/27/279416.jpg",
    "Sharpener": "https://static-01.daraz.pk/p/65458bc03896e157446bac82874402ba.jpg",
    "School Bag": "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300",
    "Water Bottle": "https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=300",
    "Geometry Box": "https://www.navneetstore.com/cdn/shop/files/All_products_1.png?format=pjpg&v=1750074120&width=1000",
    "Glue Stick": "https://static.wixstatic.com/media/59195a_54ee32e0f844427cb40fa3fe13cb0d33~mv2.png/v1/fill/w_1200%2Ch_1200%2Cal_c%2Cq_90%2Cenc_avif%2Cquality_auto/59195a_54ee32e0f844427cb40fa3fe13cb0d33~mv2.png",
    "A4 Paper Pack": "https://murukali.com/cdn/shop/files/Double-A-paper-A4-Ream-murukali-com-3793_2044x2044.jpg?v=1744977133",
    "Crayons": "https://zartart.com.au/cdn/shop/files/CRZ551_2.jpg?v=1738022208&width=1500",
    "Drawing Book": "https://action.com/hostedassets/CMSArticleImages/63/31/2576939_8714333002939-110_02_20230720153306.png?quality=75&width=1200",
   "Pencil": "images/pencil.jpg",
"Stapler": "images/stapler.jpg",
"Marker": "images/marker.jpg",
"Highlighter": "images/highlighter.jpg",
"File Folder": "images/file-folder.jpg",
"Scissors": "images/scissors.jpg",
"Calculator": "images/calculator.jpg",
"Sticky Notes": "images/sticky-notes.jpg",
"Ruler": "images/ruler.jpg"
};

const image = (product.image && product.image.startsWith("data:image/"))
    ? product.image
    : productImages[product.name] ||
      "https://placehold.co/300x200?text=Product";
        const card = document.createElement("div");

        card.className = "product-card";

        card.innerHTML = `
            <img src="${image}"
                 alt="Product"
                 class="product-picture">

            <h3>${product.name}</h3>

            <p>Price: ₹${Number(product.price).toFixed(2)}</p>

            <p>Quantity: ${product.quantity}</p>

            <p class="${status === "Low Stock" ? "low" : "available"}">
                ${status}
            </p>

            <button type="button" onclick="editProduct(${index})">
                Edit
            </button>

            <button type="button" onclick="deleteProduct(${index})">
                Delete
            </button>
        `;

        productGrid.appendChild(card);
    });
}


// Add new product
form.addEventListener("submit", async function (event) {

    event.preventDefault();

    const name = document.getElementById("productName").value.trim();
    const price = Number(document.getElementById("price").value);
    const quantity = Number(document.getElementById("quantity").value);
    const minStock = Number(document.getElementById("minStock").value);

    if (!name || price <= 0 || quantity < 0 || minStock < 0) {
        alert("Please enter valid product details.");
        return;
    }

    const newProduct = {
        name: name,
        price: price,
        quantity: quantity,
        minStock: minStock,
        image: selectedImage
    };
       try {
        const response = await fetch("/api/products", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(newProduct)
        });

        if (!response.ok) {
            throw new Error("Database save failed");
        }

        const result = await response.json();
        newProduct.id = result.id;

    } catch (error) {
        alert("Could not save product to database.");
        console.error(error);
        return;
    }

    products.push(newProduct);

    saveData();
    displayProducts();

    form.reset();

    selectedImage = "";
    previewImage.src = "";
    previewImage.style.display = "none";

    alert("Product added successfully!");
});


// Delete product
async function deleteProduct(index) {

    if (confirm("Do you want to delete this product?")) {

        const product = products[index];

        if (product.id) {
            try {
                const response = await fetch(
                    `/api/products/${product.id}`,
                    { method: "DELETE" }
                );

                if (!response.ok) {
                    throw new Error("Delete failed");
                }

            } catch (error) {
                alert("Could not delete product from database.");
                console.error(error);
                return;
            }
        }

        products.splice(index, 1);
        saveData();
        displayProducts();
    }
}

// Edit product
function editProduct(index) {

    editingProduct = products[index];

    document.getElementById("editName").value =
        editingProduct.name;

    document.getElementById("editPrice").value =
        editingProduct.price;

    document.getElementById("editQuantity").value =
        editingProduct.quantity;

    document.getElementById("editMinStock").value =
        editingProduct.minStock;

    document.getElementById("editForm").style.display = "block";
}


// Update product
async function updateProduct() {

    if (!editingProduct) return;

    const price = Number(document.getElementById("editPrice").value);
    const quantity = Number(document.getElementById("editQuantity").value);
    const minStock = Number(document.getElementById("editMinStock").value);

    if (
        price <= 0 ||
        quantity < 0 ||
        minStock < 0 ||
        document.getElementById("editPrice").value === "" ||
        document.getElementById("editQuantity").value === "" ||
        document.getElementById("editMinStock").value === ""
    ) {
        alert("Please enter valid values.");
        return;
    }

    editingProduct.price = price;
    editingProduct.quantity = quantity;
    editingProduct.minStock = minStock;
       if (editingProduct.id) {
        try {
            const response = await fetch(
                `/api/products/${editingProduct.id}`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: editingProduct.name,
                        price: price,
                        quantity: quantity,
                        minStock: minStock
                    })
                }
            );

            if (!response.ok) {
                throw new Error("Database update failed");
            }

        } catch (error) {
            alert("Could not update product in database.");
            console.error(error);
            return;
        }
    }
    saveData();
    displayProducts();

    document.getElementById("editForm").style.display = "none";

    editingProduct = null;

    alert("Product updated successfully!");
}


// Cancel editing
function cancelEdit() {

    document.getElementById("editForm").style.display = "none";

    editingProduct = null;
}

// Display products when page opens
displayProducts();

// Fetch products from MySQL
async function loadProductsFromDatabase() {
    try {
        const response = await fetch("/api/products");

        if (!response.ok) {
            throw new Error("Could not fetch products");
        }

        const databaseProducts = await response.json();

       console.log("Products from MySQL:", databaseProducts);

// Add database products without duplicating existing products
databaseProducts.forEach(dbProduct => {

    const existingProduct = products.find(
        product => product.name === dbProduct.name
    );

    if (existingProduct) {

        existingProduct.id = dbProduct.id;
        existingProduct.price = Number(dbProduct.price);
        existingProduct.quantity = Number(dbProduct.quantity);
        existingProduct.minStock = Number(dbProduct.min_stock);

    } else {

        products.push({
            id: dbProduct.id,
            name: dbProduct.name,
            price: Number(dbProduct.price),
            quantity: Number(dbProduct.quantity),
            minStock: Number(dbProduct.min_stock)
        });

    }
});

displayProducts();

    } catch (error) {
        console.error("Database error:", error);
    }
}

loadProductsFromDatabase();
    </script>
   

</body>
</html>
